<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>포켓스파이어</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- ══ 타이틀 ══════════════════════════════════════════════ -->
  <section id="screen-title" class="screen is-on">
    <div class="title-wrap">
      <h1 class="game-title">포켓<span>스파이어</span></h1>
      <p class="game-sub">잡고 · 짜고 · 첨탑을 오른다</p>

      <div class="starter-pick">
        <h2 class="pick-head">파트너를 고른다</h2>
        <div id="starter-list" class="starter-list"></div>
      </div>

      <!-- 적어 둔 판이 있을 때만 보인다 (core/save.js) -->
      <div id="resume-row" class="resume-row" hidden>
        <button id="btn-resume" class="btn btn-primary btn-lg">이어서 한다</button>
        <div id="resume-info" class="resume-info"></div>
        <button id="btn-discard" class="btn-linky">저장을 지우고 처음부터</button>
      </div>

      <div class="title-actions">
        <label class="seed-row">
          <span>시드</span>
          <input id="seed-input" type="text" maxlength="12" spellcheck="false" />
        </label>
        <button id="btn-start" class="btn btn-primary btn-lg" disabled>모험을 시작한다</button>
        <button id="btn-multi" class="btn btn-lg">같이 하기</button>
      </div>

      <p class="title-note">
        같은 시드는 같은 지도·같은 보상을 낸다. 비워 두면 무작위로 정해진다.
      </p>
    </div>
  </section>

  <!-- ══ 멀티 로비 ════════════════════════════════════════════ -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-wrap">
      <h2 class="lobby-title">같이 하기</h2>

      <!-- 방을 만들지 들어갈지 -->
      <div id="lobby-entry" class="lobby-entry">
        <button id="btn-create" class="btn btn-primary btn-lg">방 만들기</button>
        <div class="lobby-or">또는</div>
        <label class="seed-row">
          <span>방 코드</span>
          <input id="code-input" type="text" maxlength="4" spellcheck="false" placeholder="ABCD" />
        </label>
        <button id="btn-join" class="btn btn-lg">방 들어가기</button>
        <button id="btn-lobby-back" class="btn-linky">돌아가기</button>
      </div>

      <!-- 들어온 뒤 -->
      <div id="lobby-room" class="lobby-room" hidden>
        <div class="room-code">
          <span class="room-code-label">방 코드</span>
          <b id="room-code-text">----</b>
          <button id="btn-copy-code" class="btn-linky">복사</button>
        </div>
        <p class="lobby-hint">이 코드를 같이 할 사람에게 알려 주세요. 최대 3명.</p>

        <div id="lobby-players" class="lobby-players"></div>

        <div class="lobby-pick">
          <h3>파트너를 고른다</h3>
          <div id="lobby-starters" class="starter-list"></div>
        </div>

        <div id="lobby-diff" class="lobby-diff"></div>

        <div class="lobby-actions">
          <button id="btn-ready" class="btn btn-lg">준비 완료</button>
          <button id="btn-go" class="btn btn-primary btn-lg" hidden disabled>모두 모였다, 출발</button>
          <button id="btn-leave" class="btn-linky">나가기</button>
        </div>
      </div>

      <div id="lobby-msg" class="lobby-msg"></div>
    </div>
  </section>

  <!-- ══ 지도 ════════════════════════════════════════════════ -->
  <section id="screen-map" class="screen">
    <div class="topbar" data-topbar></div>
    <div class="relicbar" data-relicbar></div>
    <div class="map-head">
      <h2>1막 · 상록의 숲</h2>
      <div class="map-legend"></div>
    </div>
    <div class="map-scroll"><canvas id="map-canvas"></canvas><div id="map-nodes"></div></div>
  </section>

  <!-- ══ 전투 ════════════════════════════════════════════════ -->
  <section id="screen-combat" class="screen">
    <div class="topbar" data-topbar></div>
    <div class="relicbar" data-relicbar></div>

    <div class="arena" id="arena">
      <div class="arena-bg"></div>

      <!-- 왼쪽: 내 파티 -->
      <div class="side side-player">
        <div id="active-slot" class="unit unit-active"></div>
        <div id="bench" class="bench"></div>
      </div>

      <!-- 오른쪽: 적 -->
      <div id="enemy-slots" class="side side-enemy"></div>

      <div id="fx-layer" class="fx-layer"></div>
      <div id="combat-log" class="combat-log"></div>
    </div>

    <div class="handbar">
      <div class="hand-left">
        <div id="energy-orb" class="energy-orb ball">
          <span class="ball-top"></span><span class="ball-band"></span>
          <span class="ball-btn"><span id="energy-text">0/3</span></span>
        </div>
        <button id="pile-draw" class="pile ball pile-draw" title="뽑을 카드">
          <span class="ball-top"></span><span class="ball-band"></span>
          <span class="ball-btn"><span class="pile-count">0</span></span>
        </button>
      </div>

      <div id="hand" class="hand"></div>

      <div class="hand-right">
        <button id="btn-endturn" class="btn btn-endturn">턴 종료</button>
        <button id="pile-discard" class="pile ball pile-discard" title="버린 카드">
          <span class="ball-top"></span><span class="ball-band"></span>
          <span class="ball-btn"><span class="pile-count">0</span></span>
        </button>
      </div>
    </div>

    <!-- 필드에 깔린 날씨·지속 효과 (ui/combatView.js renderField) -->
    <div id="field-bar" class="field-bar"></div>
    <div id="switch-hint" class="switch-hint"></div>
  </section>

  <!-- ══ 덮개 화면들 ══════════════════════════════════════════ -->
  <div id="overlay" class="overlay">
    <div id="overlay-body" class="overlay-body"></div>
  </div>

  <div id="tooltip" class="tooltip"></div>
</div>

<!-- 세로로 들었을 때만 보인다 (ui/stage.js 가 body 에 is-portrait 를 붙인다) -->
<div class="rotate-note">
  <div class="rotate-icon">📱</div>
  <h2>화면을 가로로 돌려 주세요</h2>
  <p>아레나가 좌우로 넓어서, 세로로는 카드와 적을 한 번에 볼 수 없습니다.</p>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
